# build.conf — Tailscale cross-compile configuration for OpenWRT
# Edit ARCHITECTURES and FEATURES to control the build.

# "latest" auto-detects from GitHub API; or pin e.g. "v1.78.1"

TAILSCALE_VERSION="latest"

# -- Target architectures
# List OpenWRT/opkg architecture names, exactly as `opkg print-architecture`
# reports them on the device. The Go toolchain settings (GOARCH/GOMIPS/GOARM)
# are derived from these in build.sh — opkg names are more specific than Go's.
# Get the right name by running on the router:  opkg print-architecture
#
# Uncomment / add lines to build for more targets.

ARCHITECTURES=(
  mipsel_24kc                  # ramips: mt7621, mt7620, mt76x8, rt305x
  mips_24kc                    # ath79 / lantiq and most big-endian MIPS
  # arm_cortex-a7_neon-vfpv4   # ARMv7 (e.g. ipq40xx, sunxi)
  # aarch64_cortex-a53         # AArch64 (e.g. mt7622, bcm27xx)
  # x86_64                     # x86-64
)

# -- Features to keep
#  Uses Tailscale's cmd/featuretags tool with --min --add to strip
# everything except listed features (+ their deps) at build time.
#  Run: go run ./cmd/featuretags --list (inside the TS source) to
# see every known feature tag and its description.

FEATURES=(
  cli
  # -- router networking (the reason to run TS on a router) --
  advertiseroutes      # subnet router: expose LAN to the tailnet
  useroutes            # use subnet routes advertised by peers
  useexitnode          # route this router's traffic via an exit node
  advertiseexitnode    # make this router an exit node
  dns                  # MagicDNS
  portmapper           # NAT-PMP/PCP/UPnP — better NAT traversal
  # -- operability --
  doctor               # on-device `tailscale debug doctor`
  wakeonlan            # wake LAN machines over the tailnet
  completion           # `tailscale completion` subcommand
  # completion_scripts # embed shell-completion scripts (needs completion)
)

# UPX compression (requires upx in PATH; not supported on all arches e.g. mips64)

UPX_ENABLED="true"
