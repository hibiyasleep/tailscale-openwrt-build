name: Build Tailscale for OpenWRT

on:
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 4 AM UTC
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: 'Tailscale version (or "latest")'
        default: 'latest'
      mode:
        description: 'Build mode'
        type: choice
        default: 'Normal'
        options:
          - Normal       # skip if already released, then publish
          - Test         # always build, do not publish
          - Re-release   # always build and publish as a new "-N" suffixed release

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Build-tool versions shared by the prepare job (which builds and caches the
  # binaries) and the build job (which restores them). Bump TOOLS_CACHE_REV to
  # force a rebuild; change APK_TOOLS_REF to pull a different apk-tools release.
  APK_TOOLS_REF: v3.0.6
  TOOLS_CACHE_REV: '2'

jobs:
  # --- Resolve version & build matrix
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
      matrix: ${{ steps.matrix.outputs.architectures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build tools (usign + apk-tools 3)
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: tools-bin
          key: tools-${{ runner.os }}-usign-apk-${{ env.APK_TOOLS_REF }}-r${{ env.TOOLS_CACHE_REV }}

      - name: Build usign + apk-tools 3 (cache miss only)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          # Built once here and cached as binaries; every per-arch build job then
          # restores them from cache instead of rebuilding for each architecture.
          mkdir -p "$GITHUB_WORKSPACE/tools-bin/lib"
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build pkg-config libssl-dev zlib1g-dev

          # usign — OpenWRT opkg feed-index signer.
          git clone --depth=1 https://git.openwrt.org/project/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build
          cmake --build /tmp/usign/build
          install -m755 /tmp/usign/build/usign "$GITHUB_WORKSPACE/tools-bin/usign"

          # apk-tools 3 — provides `apk mkpkg` / `apk mkndx` for OpenWRT 25 .apk.
          # zstd/lua/docs are optional and auto-disable when their deps are absent,
          # so only openssl + zlib are needed.
          git clone --depth=1 --branch "$APK_TOOLS_REF" https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          ( cd /tmp/apk-tools && meson setup build -Dprefix=/usr/local && ninja -C build src/apk )
          install -m755 /tmp/apk-tools/build/src/apk "$GITHUB_WORKSPACE/tools-bin/apk"
          # The apk binary links against apk-tools' own libapk.so.3.x, so cache the
          # shared lib too (preserving the soname symlinks) — the binary alone fails
          # at load with "libapk.so.3.0.0: cannot open shared object file".
          cp -a /tmp/apk-tools/build/src/libapk.so* "$GITHUB_WORKSPACE/tools-bin/lib/"

      - name: Override version from workflow input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tailscale_version != ''
        run: |
          sed -i "s/^TAILSCALE_VERSION=.*/TAILSCALE_VERSION=\"${{ github.event.inputs.tailscale_version }}\"/" build.conf

      - name: Resolve Tailscale version
        id: version
        run: |
          source build.conf
          if [ "$TAILSCALE_VERSION" = "latest" ]; then
            TAILSCALE_VERSION="$(curl -fsSL https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r .tag_name)"
          fi
          if [ "${{ github.event.inputs.mode }}" = "Re-release" ]; then
            # Find the next free -N suffix so we publish a fresh release instead of overwriting.
            n=1
            while gh release view "build-${TAILSCALE_VERSION}-${n}" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            TAILSCALE_VERSION="${TAILSCALE_VERSION}-${n}"
          fi
          echo "version=$TAILSCALE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $TAILSCALE_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already released
        id: check
        run: |
          if [ "${{ github.event.inputs.mode }}" != "Normal" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.inputs.mode }} mode; skipping release check."
            exit 0
          fi
          TAG="build-${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate matrix from build.conf
        id: matrix
        run: |
          source build.conf
          # Build JSON array from ARCHITECTURES, e.g. ["mipsle:softfloat","arm:7"]
          json="$(printf '%s\n' "${ARCHITECTURES[@]}" | jq -R . | jq -sc .)"
          echo "architectures=$json" >> "$GITHUB_OUTPUT"
          echo "Matrix: $json"

  # --- Per-architecture build
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Restore build tools (usign + apk-tools 3)
        uses: actions/cache/restore@v4
        with:
          path: tools-bin
          key: tools-${{ runner.os }}-usign-apk-${{ env.APK_TOOLS_REF }}-r${{ env.TOOLS_CACHE_REV }}
          fail-on-cache-miss: true

      - name: Install build tools
        run: |
          # usign + apk were built and cached by the prepare job; install them
          # onto PATH here. fakeroot is a runtime dep of package-apk.sh (it records
          # root:root ownership in the .apk payload), not a build dep, so it stays.
          sudo install -m755 tools-bin/usign /usr/local/bin/usign
          sudo install -m755 tools-bin/apk   /usr/local/bin/apk
          # apk needs its shared lib (libapk.so.3.x) on the loader path.
          sudo cp -a tools-bin/lib/libapk.so* /usr/local/lib/
          sudo ldconfig
          sudo apt-get update && sudo apt-get install -y fakeroot
          command -v usign
          apk --version

      - name: Write feed signing key
        id: signkey
        env:
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: |
          if [ -n "$USIGN_SECRET_KEY" ]; then
            printf '%s\n' "$USIGN_SECRET_KEY" > "$RUNNER_TEMP/tailscale-feed.sec"
            chmod 600 "$RUNNER_TEMP/tailscale-feed.sec"
            echo "path=$RUNNER_TEMP/tailscale-feed.sec" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::USIGN_SECRET_KEY secret not set — feed will be UNSIGNED."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write apk feed signing key
        id: apksignkey
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -n "$APK_SIGN_KEY" ]; then
            printf '%s\n' "$APK_SIGN_KEY" > "$RUNNER_TEMP/tailscale-apk.sec"
            chmod 600 "$RUNNER_TEMP/tailscale-apk.sec"
            echo "path=$RUNNER_TEMP/tailscale-apk.sec" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APK_SIGN_KEY secret not set — apk feed index will be UNSIGNED."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Override version from workflow input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tailscale_version != ''
        run: |
          sed -i "s/^TAILSCALE_VERSION=.*/TAILSCALE_VERSION=\"${{ github.event.inputs.tailscale_version }}\"/" build.conf

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh "${{ matrix.arch }}"

      - name: Package .ipk (OpenWRT ≤24)
        env:
          USIGN_SEC: ${{ steps.signkey.outputs.path }}
        run: |
          chmod +x package.sh
          ./package.sh "${{ matrix.arch }}"

      - name: Package .apk (OpenWRT 25+)
        env:
          APK_SIGN_KEY: ${{ steps.apksignkey.outputs.path }}
        run: |
          chmod +x package-apk.sh
          ./package-apk.sh "${{ matrix.arch }}"

      - name: Sanitize arch for artifact name
        id: safe
        run: echo "name=${ARCH//:/_}" >> "$GITHUB_OUTPUT"
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ steps.safe.outputs.name }}
          path: |
            tailscale_*.ipk
            feed/

  # --- Collect artifacts, release, deploy feed
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true' && github.event.inputs.mode != 'Test'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          TAG="build-${{ needs.prepare.outputs.version }}"
          # Collect .apk packages from the feed tree, renaming each with its arch
          # so the release assets don't collide (the in-feed name omits arch).
          shopt -s nullglob
          apks=()
          for f in feed/packages/*/tailscale-*.apk; do
            arch="$(basename "$(dirname "$f")")"
            dest="$(basename "$f" .apk)_${arch}.apk"
            cp "$f" "$dest"
            apks+=("$dest")
          done
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tailscale ${{ needs.prepare.outputs.version }}" \
            --notes "Automated multi-arch build of Tailscale ${{ needs.prepare.outputs.version }} for OpenWRT.

          Architectures: $(echo '${{ needs.prepare.outputs.matrix }}' | jq -r 'join(", ")')

          OpenWRT ≤24 (opkg): add the feed or download a .ipk.
          OpenWRT 25+ (apk):  add the feed or download a .apk." \
            tailscale_*.ipk "${apks[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy package feed (opkg + apk) to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          destination_dir: .
          keep_files: false
